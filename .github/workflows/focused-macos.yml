name: focused-macos

on:
  pull_request:
  push:

permissions:
  contents: read

jobs:
  check:
    runs-on: macos-14
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v5
      - name: Check formatting
        run: cargo fmt --all -- --check
      - name: Enforce focused-product boundary
        run: ./script/check-focused-product
      - name: Check macOS editor
        run: cargo check --locked -p zed --tests
      - name: Validate bundled macOS keymaps
        # The unoptimized Zed test image exceeds the ARM64 branch range for the
        # older Apple linker on macos-14 runners. release-fast keeps the same
        # assertions while producing a substantially smaller executable.
        run: cargo test --locked --profile release-fast -p zed test_bundled_macos_keymaps_reference_registered_actions
      - name: Test GPUI
        run: cargo test --locked -p gpui --lib
      - name: Check remote server
        run: cargo check --locked -p remote_server
